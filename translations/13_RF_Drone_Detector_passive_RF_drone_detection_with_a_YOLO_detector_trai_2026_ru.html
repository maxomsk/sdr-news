<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RF Drone Detector: пассивное обнаружение дронов по RF-сигналам с помощью детектора YOLO, обученного на синтетических спектрограммах уровня IQ</title>
<style>
  :root {
    --bg: #0b0f19;
    --card: #151d2f;
    --border: #222f46;
    --text: #f1f5f9;
    --sub: #94a3b8;
    --primary: #38bdf8;
    --primary-hover: #0284c7;
    --danger: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --sub: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --danger: #dc2626;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 16px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 1rem;
    padding: 2.25rem 2rem;
    max-width: 24rem;
    width: 100%;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2), 0 8px 10px -6px rgba(0,0,0,0.1);
    text-align: center;
    transition: opacity 0.2s;
  }
  .icon {
    font-size: 2.25rem;
    margin-bottom: 0.75rem;
    display: inline-block;
  }
  h1 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
    line-height: 1.35;
  }
  p {
    font-size: 0.875rem;
    color: var(--sub);
    margin-bottom: 1.4rem;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  input[type="password"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="password"]:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
  }
  button {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s, opacity 0.2s;
  }
  button:hover {
    background: var(--primary-hover);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .error {
    color: var(--danger);
    font-size: 0.85rem;
    margin-top: 0.6rem;
    min-height: 1.2rem;
  }
  .loading {
    display: none;
    color: var(--sub);
    font-size: 0.85rem;
    margin-top: 0.6rem;
  }
</style>
</head>
<body>
<div class="login-card" id="loginBox">
  <div class="icon">🔒</div>
  <h1>RF Drone Detector: пассивное обнаружение дронов по RF-сигналам с помощью детектора YOLO, обученного на синтетических спектрограммах уровня IQ</h1>
  <p>Доступ защищён паролем</p>
  <form id="loginForm">
    <input type="password" id="pw" placeholder="Введите пароль..." autofocus required autocomplete="current-password">
    <button type="submit" id="btnSubmit">Войти</button>
  </form>
  <div class="error" id="errMsg"></div>
  <div class="loading" id="loadMsg">Расшифровка данных...</div>
</div>

<script>
(function() {
  const encElem = document.getElementById("encData");
  const form = document.getElementById("loginForm");
  const pwInput = document.getElementById("pw");
  const errMsg = document.getElementById("errMsg");
  const loadMsg = document.getElementById("loadMsg");
  const loginBox = document.getElementById("loginBox");
  const btnSubmit = document.getElementById("btnSubmit");

  const payload = JSON.parse(encElem.textContent);

  async function decryptContent(password) {
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      enc.encode(password),
      { name: "PBKDF2" },
      false,
      ["deriveKey"]
    );
    const saltBytes = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
    const ivBytes = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
    const ctBytes = Uint8Array.from(atob(payload.ciphertext), c => c.charCodeAt(0));

    const key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: saltBytes,
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: ivBytes },
      key,
      ctBytes
    );
    return dec.decode(decrypted);
  }

  function applyHtml(htmlText) {
    document.open();
    document.write(htmlText);
    document.close();
  }

  async function tryPassword(pw) {
    errMsg.textContent = "";
    loadMsg.style.display = "block";
    btnSubmit.disabled = true;
    try {
      const htmlText = await decryptContent(pw);
      sessionStorage.setItem("sdr_news_pw", pw);
      applyHtml(htmlText);
    } catch (e) {
      loadMsg.style.display = "none";
      btnSubmit.disabled = false;
      errMsg.textContent = "Неверный пароль";
      pwInput.value = "";
      pwInput.focus();
    }
  }

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    const pw = pwInput.value.trim();
    if (pw) {
      tryPassword(pw);
    }
  });

  const saved = sessionStorage.getItem("sdr_news_pw");
  if (saved) {
    loginBox.style.opacity = "0.2";
    loadMsg.style.display = "block";
    tryPassword(saved).catch(() => {
      loginBox.style.opacity = "1";
      loadMsg.style.display = "none";
      sessionStorage.removeItem("sdr_news_pw");
    });
  }
})();
</script>
